<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006633" />
    <meta name="description" content="Ghana Health Service Bawku West Zongoire Sub-District Health Performance Validation & DHIMS2 M&E System 2026" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="GHS M&E 2026" />
    <meta name="application-name" content="GHS M&E 2026" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Allow browser to natively handle beforeinstallprompt and show install icon in address bar/URL omnibox
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // We do not preventDefault so browser-supported install icon and address bar prompt appear natively
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] Native beforeinstallprompt active for address bar installation.');
      });

      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('[PWA] Application successfully installed.');
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
